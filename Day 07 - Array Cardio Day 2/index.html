<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Day 07 - Array Cardio (Day 2)</title>
        <link rel="icon" href="https://fav.farm/🔥" />
        <meta name="description" content="Day 07 - Array Cardio (Day 2)">
    </head>

    <body>
        <p><em>Psst: have a look at the JavaScript Console</em> 💁</p>
        <script>
            // ## Array Cardio Day 2

            const people = [
                { name: 'Wes', year: 1988 },
                { name: 'Kait', year: 1986 },
                { name: 'Irv', year: 1970 },
                { name: 'Lux', year: 2015 }
            ];

            const comments = [
                { text: 'Love this!', id: 523423 },
                { text: 'Super good', id: 823423 },
                { text: 'You are the best', id: 2039842 },
                { text: 'Ramen is my fav food ever', id: 123523 },
                { text: 'Nice Nice Nice!', id: 542328 }
            ];

            const currDate = new Date();
            const currYear = currDate.getFullYear();

            // Some and Every Checks
            // Array.prototype.some() // is at least one person 19 or older?
            console.log("Is at least one person 19 or older?")
            console.log(people.some((person) => (currYear - person.year) >= 19))

            // Array.prototype.every() // is everyone 19 or older?
            console.log("Is everyone 19 or older?")
            console.log(people.every((person) => (currYear - person.year) >= 19))

            // Array.prototype.find()
            // Find is like filter, but instead returns just the one you are looking for
            // find the comment with the ID of 823423
            console.log("Find the comment with the ID of 823423");
            console.log(comments.find((comment) => comment.id === 823423));

            // Array.prototype.findIndex()
            // Find the comment with this ID
            // delete the comment with the ID of 823423
            const indexOfComment = comments.findIndex((comment) => comment.id === 823423);
            if (indexOfComment > -1) {
                console.log(comments.toSpliced(indexOfComment, 1));
            }

        </script>
    </body>

</html>
