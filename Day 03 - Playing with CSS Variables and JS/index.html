<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Day 03 - Playing with CSS Variables and JS</title>
        <meta name="description" content="Day 03 - Playing with CSS Variables and JS">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Playing with CSS Variables and <span class="highlight">JS</span></h1>
        <div class="controls">
            <div class="form-control"><label for="spacing">Spacing</label><input type="range" name="spacing"
                    id="spacing" min="0" max="100" data-sizing="px"></div>
            <div class="form-control"><label for="blur">Blur</label><input type="range" name="blur" id="blur" min="0"
                    max="20" data-sizing="px"></div>
            <div class="form-control"><label for="highlight">Background</label><input type="color" name="highlight"
                    value="#ddee00" id="highlight">
            </div>
        </div>
        <img src="http://unsplash.it/800/500?image=26" />
        <script type="text/javascript" src="script.js"></script>
    </body>

</html>
